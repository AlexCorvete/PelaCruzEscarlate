<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pela Cruz Escarlate — Álbum Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    :root {
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.55);
      --crimson: #8b1e1e;
      --crimson-glow: #c82824;
      --text: #f6f2e9;
      --text-dim: #e3dcd0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #050608;
      position: relative;
    }

    /* Imagem de fundo inteira (sem cortes, sem desfoque e sem escurecimento) */
    .album-backdrop {
      position: fixed;
      inset: 0;
      background-color: #050608;
      background-image: url('./imagens/capa-album.jpg');
      background-size: contain;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
    }

    /* Botão de Portfólio (Desktop: canto superior direito) */
    .portfolio-btn {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 10;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--gold);
      background: rgba(10, 12, 18, 0.72);
      border: 1px solid var(--gold-soft);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.75);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .portfolio-btn:hover {
      color: #fff;
      border-color: var(--gold);
      background: rgba(139, 30, 30, 0.75);
      transform: translateY(-1px);
    }

    /* ================= DESKTOP: CARROSSEL QUADRADO 1:1 A ~25% DA MARGEM INFERIOR ================= */
    .desktop-player {
      position: fixed;
      left: 50%;
      bottom: 24vh;
      transform: translateX(-50%);
      width: 588px; /* 3 slides de 196px = 588px exatos para proporção 1:1 real */
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .swiper.mySwiper {
      width: 100%;
      padding-top: 8px;
      padding-bottom: 28px;
    }

    .swiper-slide {
      width: 196px !important;
      height: 196px !important;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background: #11131a;
      border: 2px solid var(--gold-soft);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.82);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .swiper-slide-active {
      border-color: var(--gold);
      box-shadow: 0 0 24px rgba(200, 40, 36, 0.65), 0 14px 32px rgba(0, 0, 0, 0.9);
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
    }

    .slide-badge {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 8px 6px;
      background: linear-gradient(to top, rgba(6, 7, 11, 0.88), rgba(6, 7, 11, 0));
      font-family: 'Cinzel', serif;
      font-size: 0.66rem;
      letter-spacing: 0.7px;
      color: var(--gold);
      text-align: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .swiper-slide-active .slide-badge {
      opacity: 1;
    }

    .swiper .swiper-button-next,
    .swiper .swiper-button-prev {
      color: var(--gold);
      transform: scale(0.75);
    }

    .swiper-pagination {
      bottom: 4px !important;
    }

    .swiper-pagination .swiper-pagination-bullet {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      opacity: 1;
    }

    .swiper-pagination .swiper-pagination-bullet-active {
      background: var(--crimson-glow);
      border: 2px solid var(--gold);
      transform: scale(1.15);
    }

    /* ================= DESKTOP: RÉGUA DE TEMPO E COMANDOS COMPACTOS (25% DAS LATERAIS, 5-10% DA BASE) ================= */
    .bottom-dock {
      position: fixed;
      left: 25%;
      right: 25%;
      bottom: 5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
    }

    .track-meta {
      text-align: center;
      margin-bottom: 6px;
    }

    .track-counter {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      text-shadow: 0 2px 6px #000, 0 0 12px #000;
    }

    .track-name {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.98rem, 1.7vw, 1.25rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      text-shadow: 0 2px 8px #000, 0 0 14px #000;
    }

    .track-sub {
      font-size: 0.86rem;
      font-style: italic;
      color: var(--text-dim);
      text-shadow: 0 2px 6px #000, 0 0 12px #000;
    }

    /* Sem retângulo/caixa de fundo: apenas linha de tempo, tempos e comandos compactos */
    .player-console {
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 2px 0 0;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .time-txt {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      min-width: 34px;
      text-align: center;
      text-shadow: 0 1px 6px #000, 0 0 10px #000;
    }

    input[type="range"]#seekBar {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]#seekBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.95), 0 0 4px #000;
      cursor: pointer;
    }

    .cmd-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .cmd-btn {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.95));
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .cmd-btn:hover {
      color: var(--gold);
      transform: scale(1.12);
    }

    .cmd-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Botão central compacto com a Cruz Escarlate */
    .cmd-cross {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 12, 14, 0.85) 0%, rgba(10, 10, 14, 0.65) 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 0 16px rgba(200, 40, 36, 0.65);
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .cmd-cross:hover {
      transform: scale(1.08);
      border-color: #fff;
      box-shadow: 0 0 24px rgba(200, 40, 36, 0.9), 0 0 12px rgba(212, 175, 55, 0.65);
    }

    .cmd-cross.is-playing {
      box-shadow: 0 0 26px rgba(200, 40, 36, 0.95), 0 0 14px rgba(212, 175, 55, 0.75);
    }

    .cmd-cross svg.templar-cross {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 6px rgba(200, 40, 36, 0.9));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .cmd-cross.is-playing svg.templar-cross {
      transform: scale(1.05);
      filter: drop-shadow(0 0 10px rgba(235, 50, 45, 1));
    }

    /* ================= MOBILE: FORMATO CLÁSSICO PRESERVADO + BOTÃO PORTFÓLIO ================= */
    .mobile-player {
      display: none;
      width: 100%;
      max-width: 340px;
      flex-direction: column;
      align-items: center;
      margin-top: 22px;
      margin-bottom: 14px;
    }

    .mobile-cover-frame {
      width: 66vw;
      max-width: 240px;
      height: 66vw;
      max-height: 240px;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--gold);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.8);
      background: #11131a;
    }

    .mobile-cover-frame img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @media (max-width: 768px) {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 16px 16px 28px;
      }

      .album-backdrop {
        background-size: cover;
      }

      .desktop-player {
        display: none;
      }

      .mobile-player {
        display: flex;
      }

      .bottom-dock {
        position: static;
        width: 100%;
        max-width: 360px;
        margin-top: 4px;
      }

      .player-console {
        background: rgba(10, 12, 18, 0.72);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(212, 175, 55, 0.45);
        border-radius: 12px;
        padding: 12px 14px 16px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      }

      .cmd-cross {
        width: 58px;
        height: 58px;
      }

      .cmd-cross svg.templar-cross {
        width: 38px;
        height: 38px;
      }

      .portfolio-btn {
        position: static;
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="album-backdrop"></div>

  <!-- Versão Desktop: Slider quadrado 1:1 posicionado mais abaixo -->
  <section class="desktop-player" aria-label="Player em Slider">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper" id="swiperWrapper"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>
  </section>

  <!-- Versão Celular: Formato clássico simples 1:1 -->
  <section class="mobile-player" aria-label="Player Clássico">
    <div class="mobile-cover-frame">
      <img id="mobileCover" src="./imagens/01.jpg" alt="Capa da faixa atual" />
    </div>
  </section>

  <!-- Informações da faixa + Régua de tempo e comandos compactos -->
  <div class="bottom-dock">
    <div class="track-meta">
      <div class="track-counter" id="trackCounter">FAIXA 01 DE 12</div>
      <div class="track-name" id="trackName">O Pão, a Água e o Abrigo</div>
      <div class="track-sub" id="trackSub">A Conversão</div>
    </div>

    <div class="player-console">
      <div class="timeline-row">
        <span class="time-txt" id="curTime">0:00</span>
        <input type="range" id="seekBar" min="0" max="100" step="0.1" value="0" aria-label="Progresso da música" />
        <span class="time-txt" id="durTime">0:00</span>
      </div>

      <div class="cmd-row">
        <button class="cmd-btn" id="prevBtn" aria-label="Música anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <!-- Botão central: Cruz Escarlate (Play / Pause) -->
        <button class="cmd-btn cmd-cross" id="playBtn" aria-label="Tocar ou pausar" title="Tocar / Pausar">
          <svg class="templar-cross" viewBox="0 0 100 100" aria-hidden="true">
            <path
              fill="#b81d1a"
              stroke="#4a0707"
              stroke-width="2.5"
              stroke-linejoin="round"
              d="M41,6 L59,6 L55,39 L74,20 L86,32 L64,50 L94,43 L94,57 L64,50 L86,68 L74,80 L55,61 L59,94 L41,94 L45,61 L26,80 L14,68 L36,50 L6,57 L6,43 L36,50 L14,32 L26,20 L45,39 Z"
            />
            <path
              id="crossGlowPath"
              fill="#df2a24"
              opacity="0.72"
              d="M44,12 L56,12 L53,42 L72,25 L80,33 L60,50 L88,46 L88,54 L60,50 L80,67 L72,75 L53,58 L56,88 L44,88 L47,58 L28,75 L20,67 L40,50 L12,54 L12,46 L40,50 L20,33 L28,25 L47,42 Z"
            />
          </svg>
        </button>

        <button class="cmd-btn" id="nextBtn" aria-label="Próxima música">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Botão de retorno ao Portfólio -->
  <a class="portfolio-btn" href="https://alexcorvete.github.io/Portf-lio/" target="_blank" rel="noopener noreferrer">
    Portfólio
  </a>

  <audio id="audioEl" preload="metadata"></audio>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const playlist = [
      {
        num: "01",
        title: "O Pão, a Água e o Abrigo",
        sub: "A Conversão",
        imgs: ["./imagens/01.jpg", "./imagens/01.jpeg"],
        audio: "./musicas/01 - O Pão, a Água e o Abrigo (A Conversão).mp3"
      },
      {
        num: "02",
        title: "A Força do Homem",
        sub: "Os Nomes do Templo",
        imgs: ["./imagens/02.jpg", "./imagens/02.jpeg"],
        audio: "./musicas/02 - A Força do Homem (Os Nomes do Templo).mp3"
      },
      {
        num: "03",
        title: "A Vontade Livre",
        sub: "Odo de Saint-Amand",
        imgs: ["./imagens/03.jpeg", "./imagens/03.jpg"],
        audio: "./musicas/03 - A Vontade Livre (Odo de Saint-Amand).mp3"
      },
      {
        num: "04",
        title: "A Alma Imóvel",
        sub: "La Fève",
        imgs: ["./imagens/04.jpeg", "./imagens/04.jpg"],
        audio: "./musicas/04 - A Alma Imóvel (La Fève).mp3"
      },
      {
        num: "05",
        title: "O Reto Dever",
        sub: "Monte Cadmo",
        imgs: ["./imagens/05.jpeg", "./imagens/05.jpg"],
        audio: "./musicas/05 - O Reto Dever (Monte Cadmo).mp3"
      },
      {
        num: "06",
        title: "A Fortaleza da Razão",
        sub: "Tomar",
        imgs: ["./imagens/06.jpeg", "./imagens/06.jpg"],
        audio: "./musicas/06 - A Fortaleza da Razão (Tomar).mp3"
      },
      {
        num: "07",
        title: "O Choque do Logos",
        sub: "Montgisard",
        imgs: ["./imagens/07.jpg", "./imagens/07.jpeg"],
        audio: "./musicas/07 - O Choque do Logos (Montgisard).mp3"
      },
      {
        num: "08",
        title: "A Flor sobre as Cinzas",
        sub: "Jacquelin de Mailly",
        imgs: ["./imagens/08.jpg", "./imagens/08.jpeg"],
        audio: "./musicas/08 - A Flor sobre as Cinzas (Jacquelin de Mailly).mp3"
      },
      {
        num: "09",
        title: "A Estultícia Alheia",
        sub: "Al-Mansura",
        imgs: ["./imagens/09.jpeg", "./imagens/09.jpg"],
        audio: "./musicas/09 - A Estultícia Alheia (Al-Mansura).mp3"
      },
      {
        num: "10",
        title: "O Freio da Ira",
        sub: "Arsuf",
        imgs: ["./imagens/10.jpeg", "./imagens/10.jpg"],
        audio: "./musicas/10 - O Freio da Ira (Arsuf).mp3"
      },
      {
        num: "11",
        title: "A Poeira e a Virtude",
        sub: "Acre",
        imgs: ["./imagens/11.jpeg", "./imagens/11.jpg"],
        audio: "./musicas/11 - A Poeira e a Virtude (Acre).mp3"
      },
      {
        num: "12",
        title: "A Justiça Inviolável",
        sub: "Jacques de Molay",
        imgs: ["./imagens/12.jpg", "./imagens/12.jpeg"],
        audio: "./musicas/12 - A Justiça Inviolável (Jacques de Molay).mp3"
      }
    ];

    function bindSmartImage(imgElement, candidates) {
      let attempt = 0;
      function tryNext() {
        if (attempt < candidates.length) {
          const nextSrc = candidates[attempt++];
          imgElement.src = nextSrc;
        } else {
          imgElement.src = "./imagens/capa-album.jpg";
        }
      }
      imgElement.onerror = tryNext;
      tryNext();
    }

    const swiperWrapper = document.getElementById("swiperWrapper");
    playlist.forEach((track, idx) => {
      const slide = document.createElement("div");
      slide.className = "swiper-slide";
      slide.dataset.trackIndex = idx;

      const img = document.createElement("img");
      img.alt = `Faixa ${track.num} - ${track.title}`;
      bindSmartImage(img, track.imgs);

      const badge = document.createElement("div");
      badge.className = "slide-badge";
      badge.textContent = `${track.num} • ${track.title}`;

      slide.appendChild(img);
      slide.appendChild(badge);
      swiperWrapper.appendChild(slide);
    });

    const swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      initialSlide: 0,
      loop: true,
      coverflowEffect: {
        rotate: 22,
        stretch: 0,
        depth: 85,
        modifier: 1,
        slideShadows: false
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
        dynamicBullets: true
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev"
      }
    });

    const audioEl = document.getElementById("audioEl");
    const mobileCover = document.getElementById("mobileCover");
    const trackCounter = document.getElementById("trackCounter");
    const trackName = document.getElementById("trackName");
    const trackSub = document.getElementById("trackSub");
    const seekBar = document.getElementById("seekBar");
    const curTime = document.getElementById("curTime");
    const durTime = document.getElementById("durTime");
    const playBtn = document.getElementById("playBtn");
    const crossGlowPath = document.getElementById("crossGlowPath");

    let activeTrackIdx = 0;
    let isPlaying = false;
    let isSyncingSwiper = false;

    function fmtTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
    }

    function setPlayingState(playing) {
      isPlaying = playing;
      playBtn.classList.toggle("is-playing", playing);
      crossGlowPath.setAttribute("opacity", playing ? "1" : "0.65");
      playBtn.setAttribute("aria-label", playing ? "Pausar música" : "Tocar música");
    }

    function loadTrack(idx, autoPlay = false, syncSlide = false) {
      const total = playlist.length;
      activeTrackIdx = ((idx % total) + total) % total;
      const track = playlist[activeTrackIdx];

      bindSmartImage(mobileCover, track.imgs);

      trackCounter.textContent = `FAIXA ${track.num} DE ${total}`;
      trackName.textContent = track.title;
      trackSub.textContent = track.sub;

      audioEl.src = encodeURI(track.audio);
      seekBar.value = 0;
      curTime.textContent = "0:00";
      durTime.textContent = "0:00";

      if (syncSlide && swiper) {
        isSyncingSwiper = true;
        swiper.slideToLoop(activeTrackIdx, 450, false);
        setTimeout(() => { isSyncingSwiper = false; }, 500);
      }

      if (autoPlay || isPlaying) {
        audioEl.play().then(() => {
          setPlayingState(true);
        }).catch(() => {});
      }
    }

    swiper.on("slideChangeTransitionStart", () => {
      if (isSyncingSwiper) return;
      const realIdx = swiper.realIndex;
      if (realIdx !== activeTrackIdx) {
        loadTrack(realIdx, isPlaying, false);
      }
    });

    document.querySelectorAll(".swiper-slide").forEach(slide => {
      slide.addEventListener("click", () => {
        const idx = Number(slide.dataset.trackIndex);
        if (!isNaN(idx) && idx !== activeTrackIdx) {
          loadTrack(idx, isPlaying, true);
        }
      });
    });

    playBtn.addEventListener("click", () => {
      if (isPlaying) {
        audioEl.pause();
        setPlayingState(false);
      } else {
        audioEl.play().then(() => {
          setPlayingState(true);
        }).catch(() => {});
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      loadTrack(activeTrackIdx + 1, isPlaying, true);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      loadTrack(activeTrackIdx - 1, isPlaying, true);
    });

    audioEl.addEventListener("loadedmetadata", () => {
      durTime.textContent = fmtTime(audioEl.duration);
    });

    audioEl.addEventListener("timeupdate", () => {
      if (!isNaN(audioEl.duration) && audioEl.duration > 0) {
        seekBar.value = (audioEl.currentTime / audioEl.duration) * 100;
        curTime.textContent = fmtTime(audioEl.currentTime);
      }
    });

    seekBar.addEventListener("input", () => {
      if (!isNaN(audioEl.duration) && audioEl.duration > 0) {
        audioEl.currentTime = (seekBar.value / 100) * audioEl.duration;
      }
    });

    audioEl.addEventListener("ended", () => {
      loadTrack(activeTrackIdx + 1, true, true);
    });

    loadTrack(0, false, true);
  </script>
</body>
</html>
